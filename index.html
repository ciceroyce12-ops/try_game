<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Souls-Like Mini RPG</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .header-container {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #d9534f;
            text-transform: uppercase;
        }
        #stats {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 3px;
        }
        canvas {
            border: 3px solid #333;
            background-color: #141414;
            box-shadow: 0 0 25px rgba(217, 83, 79, 0.15);
            max-width: 95vw;
            height: auto;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
            width: 100%;
            max-width: 400px;
            padding: 0 10px;
        }
        button {
            background-color: #262626;
            color: white;
            border: 1px solid #444;
            padding: 14px 0;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }
        button:active {
            background-color: #444;
        }
        .btn-dodge { background-color: #335577; }
        .btn-attack { background-color: #773333; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Trial by Death: Elden Pixel</h1>
        <div id="stats">Level: <span id="lvl-display">1</span> | Deaths: <span id="death-display">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="600" height="300"></canvas>

    <div class="controls">
        <button id="btn-left">←</button>
        <button id="btn-right">→</button>
        <button id="btn-dodge" class="btn-dodge">DODGE</button>
        <button id="btn-attack" class="btn-attack">HIT</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lvlDisplay = document.getElementById('lvl-display');
        const deathDisplay = document.getElementById('death-display');

        // Game States & Stats
        let stats = {
            level: 1,
            deaths: 0
        };

        const player = {
            x: 100,
            y: 220,
            width: 24,
            height: 40,
            speed: 4,
            vx: 0,
            hp: 100,
            maxHp: 100,
            stamina: 100,
            maxStamina: 100,
            isDodging: false,
            dodgeTimer: 0,
            isAttacking: false,
            attackTimer: 0,
            facing: 1
        };

        const boss = {
            x: 450,
            y: 200,
            width: 40,
            height: 60,
            hp: 300,
            maxHp: 300,
            attackCooldown: 0,
            state: 'IDLE', // IDLE, CHARGING, ATTACKING
            telegraphTimer: 0,
            vx: 0
        };

        let keys = { left: false, right: false };

        // Input Listeners (Keyboard)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === ' ' || e.key === 'Shift') triggerDodge();
            if (e.key === 'j' || e.key === 'Enter') triggerAttack();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        // Touch Listeners (Mobile)
        document.getElementById('btn-left').addEventListener('touchstart', () => keys.left = true);
        document.getElementById('btn-left').addEventListener('touchend', () => keys.left = false);
        document.getElementById('btn-right').addEventListener('touchstart', () => keys.right = true);
        document.getElementById('btn-right').addEventListener('touchend', () => keys.right = false);
        document.getElementById('btn-dodge').addEventListener('click', triggerDodge);
        document.getElementById('btn-attack').addEventListener('click', triggerAttack);

        function triggerDodge() {
            if (player.stamina >= 25 && !player.isDodging) {
                player.isDodging = true;
                player.dodgeTimer = 18; // i-frame duration
                player.stamina -= 25;
            }
        }

        function triggerAttack() {
            if (player.stamina >= 15 && !player.isAttacking && !player.isDodging) {
                player.isAttacking = true;
                player.attackTimer = 12;
                player.stamina -= 15;

                // Check melee hit against boss
                let hitBoxX = player.facing > 0 ? player.x + player.width : player.x - 30;
                if (hitBoxX < boss.x + boss.width && hitBoxX + 30 > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    boss.hp -= (15 + stats.level * 3); // Scaled damage per level
                    if (boss.hp <= 0) {
                        resetBoss();
                    }
                }
            }
        }

        function resetBoss() {
            stats.level++;
            boss.maxHp = 300 + (stats.level * 80);
            boss.hp = boss.maxHp;
            boss.x = 450;
        }

        function handleDeath() {
            stats.deaths++;
            stats.level++; // Level increases on death ("level is started from each time u die")
            player.hp = player.maxHp + (stats.level * 10);
            player.maxHp = player.hp;
            player.x = 100;
            boss.hp = boss.maxHp;
            lvlDisplay.innerText = stats.level;
            deathDisplay.innerText = stats.deaths;
        }

        function update() {
            // Stamina regeneration
            if (player.stamina < player.maxStamina) {
                player.stamina += 0.8;
            }

            // Player Movement
            if (player.isDodging) {
                player.x += player.facing * 8;
                player.dodgeTimer--;
                if (player.dodgeTimer <= 0) player.isDodging = false;
            } else {
                let currentSpeed = player.speed;
                if (keys.left) {
                    player.x -= currentSpeed;
                    player.facing = -1;
                }
                if (keys.right) {
                    player.x += currentSpeed;
                    player.facing = 1;
                }
            }

            // Boundaries
            if (player.x < 10) player.x = 10;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            // Boss AI logic (Elden Ring style rhythm: idle -> telegraph flash -> heavy lunge attack)
            if (boss.state === 'IDLE') {
                boss.attackCooldown++;
                // Move slowly towards player
                if (boss.x > player.x + 60) boss.x -= 1.2 + (stats.level * 0.1);
                else if (boss.x < player.x - 60) boss.x += 1.2 + (stats.level * 0.1);

                if (boss.attackCooldown > 70) {
                    boss.state = 'CHARGING';
                    boss.telegraphTimer = 35; // Warning window to dodge
                    boss.attackCooldown = 0;
                }
            } else if (boss.state === 'CHARGING') {
                boss.telegraphTimer--;
                if (boss.telegraphTimer <= 0) {
                    boss.state = 'ATTACKING';
                    boss.vx = (player.x > boss.x ? 1 : -1) * 9; // Lunge speed
                }
            } else if (boss.state === 'ATTACKING') {
                boss.x += boss.vx;
                // Collision with player during boss attack
                if (player.x < boss.x + boss.width && player.x + player.width > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    if (!player.isDodging) {
                        player.hp -= (45 + stats.level * 5); // Brutal soulslike damage
                        if (player.hp <= 0) {
                            handleDeath();
                        }
                    }
                }
                // Return to idle after lunge distance
                if (Math.abs(boss.vx) > 0) {
                    boss.vx *= 0.85;
                    if (Math.abs(boss.vx) < 0.5) boss.state = 'IDLE';
                }
            }
        }

        function draw() {
            // Clear Screen
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Arena Floor Line
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 260);
            ctx.lineTo(canvas.width, 260);
            ctx.stroke();

            // Draw Player
            ctx.fillStyle = player.isDodging ? '#5bc0de' : '#5cb85c';
            if (player.isAttacking) ctx.fillStyle = '#f0ad4e';
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // Draw Sword Slash Effect if attacking
            if (player.isAttacking) {
                ctx.fillStyle = '#fff';
                let slashX = player.facing > 0 ? player.x + player.width : player.x - 20;
                ctx.fillRect(slashX, player.y + 10, 20, 10);
            }

            // Draw Boss (Changes color based on state: Red = dangerous telegraph)
            if (boss.state === 'CHARGING') {
                ctx.fillStyle = '#d9534f'; // Warning flash
            } else if (boss.state === 'ATTACKING') {
                ctx.fillStyle = '#ff3333';
            } else {
                ctx.fillStyle = '#a94442';
            }
            ctx.fillRect(boss.x, boss.y, boss.width, boss.height);

            // Health Bars & Stamina Bars Render
            // Player HP Bar
            ctx.fillStyle = '#333';
            ctx.fillRect(20, 20, 150, 12);
            ctx.fillStyle = '#5cb85c';
            ctx.fillRect(20, 20, Math.max(0, (player.hp / player.maxHp) * 150), 12);
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText(`HP: ${Math.max(0, Math.floor(player.hp))}`, 25, 30);

            // Player Stamina Bar
            ctx.fillStyle = '#333';
            ctx.fillRect(20, 36, 100, 8);
            ctx.fillStyle = '#f0ad4e';
            ctx.fillRect(20, 36, (player.stamina / player.maxStamina) * 100, 8);

            // Boss HP Bar
            ctx.fillStyle = '#333';
            ctx.fillRect(canvas.width - 170, 20, 150, 12);
            ctx.fillStyle = '#d9534f';
            ctx.fillRect(canvas.width - 170, 20, Math.max(0, (boss.hp / boss.maxHp) * 150), 12);
            ctx.fillStyle = '#fff';
            ctx.fillText(`BOSS HP`, canvas.width - 130, 30);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
