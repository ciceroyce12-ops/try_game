<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Souls-Like Mini RPG - Pyramid Platform Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #0b0b0e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .header-container {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #e06c75;
            text-transform: uppercase;
        }
        #stats {
            font-size: 0.8rem;
            color: #9da5b4;
            margin-top: 3px;
        }
        .canvas-container {
            position: relative;
        }
        canvas {
            border: 3px solid #282c34;
            background: linear-gradient(to bottom, #121318, #1a1b24);
            box-shadow: 0 0 30px rgba(224, 108, 117, 0.15);
            max-width: 98vw;
            height: auto;
            display: block;
        }
        /* Pause & Victory Overlay */
        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 14, 0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            padding: 20px;
        }
        #overlay-screen h2 {
            margin: 0 0 15px 0;
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(224, 108, 117, 0.5);
        }
        #overlay-screen p {
            margin: 0 0 20px 0;
            font-size: 1.1rem;
            color: #61afef;
            text-shadow: 0 0 10px rgba(97, 175, 239, 0.4);
        }
        .upgrade-container {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-upgrade {
            background-color: #21252b;
            color: #e0e0e0;
            border: 2px solid #61afef;
            padding: 12px 20px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(97, 175, 239, 0.3);
            transition: all 0.2s;
        }
        .btn-upgrade:active {
            background-color: #61afef;
            color: #0b0b0e;
        }
        #death-tutorial-text {
            font-size: 0.9rem;
            color: #abb2bf;
            max-width: 450px;
            line-height: 1.4;
            margin: 0 0 20px 0;
            display: none;
            background: #16171d;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px dashed #383a42;
        }
        #btn-restart {
            background-color: #e06c75;
            color: #0b0b0e;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(224, 108, 117, 0.4);
            display: none;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 10px;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }
        button {
            background-color: #21252b;
            color: white;
            border: 1px solid #383a42;
            padding: 12px 0;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }
        button:active {
            background-color: #383a42;
        }
        .btn-jump { background-color: #4c412b; }
        .btn-dodge { background-color: #294966; }
        .btn-attack { background-color: #662929; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Trial by Death</h1>
        <div id="stats">Level: <span id="lvl-display">1</span> | Wins: <span id="win-display">0</span>/10 | Deaths: <span id="death-display">0</span> | Combo: <span id="combo-display">0</span>/4</div>
    </div>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="350"></canvas>
        <div id="overlay-screen">
            <h2 id="overlay-title">Level 1 Beaten, Choose Upgrade:</h2>
            <div id="upgrade-options" class="upgrade-container">
                <button class="btn-upgrade" id="btn-dmg-up">⚔️ UPGRADE DAMAGE (+50%)</button>
                <button class="btn-upgrade" id="btn-hp-up">🛡️ UPGRADE HEALTH (+50 Max HP & Heal)</button>
            </div>
            <div id="death-tutorial-text"></div>
            <button id="btn-restart">TRY AGAIN?</button>
            <p id="overlay-credit" style="display:none; margin-top: 15px;">made by Ciceroyce</p>
        </div>
    </div>

    <div class="controls">
        <button id="btn-left">←</button>
        <button id="btn-right">→</button>
        <button id="btn-jump" class="btn-jump">JUMP</button>
        <button id="btn-dodge" class="btn-dodge">DODGE</button>
        <button id="btn-attack" class="btn-attack">HIT</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lvlDisplay = document.getElementById('lvl-display');
        const winDisplay = document.getElementById('win-display');
        const deathDisplay = document.getElementById('death-display');
        const comboDisplay = document.getElementById('combo-display');
        const overlayScreen = document.getElementById('overlay-screen');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayCredit = document.getElementById('overlay-credit');
        const upgradeOptions = document.getElementById('upgrade-options');
        const deathTutorialText = document.getElementById('death-tutorial-text');
        const btnRestart = document.getElementById('btn-restart');

        let stats = {
            level: 1,
            wins: 0,
            deaths: 0
        };

        let gameState = 'PLAYING'; // PLAYING, WIN_PAUSE, DEATH, VICTORY
        const groundLevel = 290;
        
        // 4-Tier Pyramid Platforms Setup
        const platforms = [
            { x: 140, y: 230, width: 520, height: 12 }, // 2nd Floor
            { x: 260, y: 170, width: 280, height: 12 }, // 3rd Floor
            { x: 360, y: 110, width: 80, height: 12 }   // 4th Floor (Peak)
        ];

        const player = {
            x: 100,
            y: groundLevel - 42,
            width: 28,
            height: 42,
            speed: 4.5,
            vy: 0,
            gravity: 0.55,
            jumpForce: -9.2,
            isGrounded: true,
            hp: 100,
            maxHp: 100,
            damageMultiplier: 1.0,
            stamina: 100,
            maxStamina: 100,
            isDodging: false,
            dodgeTimer: 0,
            isAttacking: false,
            attackTimer: 0,
            facing: 1,
            comboCount: 0,
            comboTimer: 0
        };

        const boss = {
            x: 650,
            y: groundLevel - 65,
            width: 48,
            height: 65,
            hp: 300,
            maxHp: 300,
            attackCooldown: 0,
            state: 'IDLE', 
            telegraphTimer: 0,
            dodgeTimer: 0,
            vx: 0,
            speedMultiplier: 1.0,
            hasDealtDamage: false,
            vy: 0,
            gravity: 0.55,
            jumpForce: -9.2,
            isGrounded: true
        };

        let lasers = [];
        let keys = { left: false, right: false };

        // Input Listeners (Keyboard)
        window.addEventListener('keydown', e => {
            if (gameState !== 'PLAYING') {
                if (e.key === 'Enter') {
                    if (gameState === 'DEATH') restartGameAfterDeath();
                }
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') triggerJump();
            if (e.code === 'ShiftLeft') triggerDodge();
            if (e.key === 'j' || e.key === 'Enter') triggerAttack();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        // Touch Listeners (Mobile)
        document.getElementById('btn-left').addEventListener('touchstart', () => { if(gameState==='PLAYING') keys.left = true; });
        document.getElementById('btn-left').addEventListener('touchend', () => keys.left = false);
        document.getElementById('btn-right').addEventListener('touchstart', () => { if(gameState==='PLAYING') keys.right = true; });
        document.getElementById('btn-right').addEventListener('touchend', () => keys.right = false);
        document.getElementById('btn-jump').addEventListener('click', () => { if(gameState==='PLAYING') triggerJump(); });
        document.getElementById('btn-dodge').addEventListener('click', () => { if(gameState==='PLAYING') triggerDodge(); });
        document.getElementById('btn-attack').addEventListener('click', () => { if(gameState==='PLAYING') triggerAttack(); });
        
        // Upgrade Buttons
        document.getElementById('btn-dmg-up').addEventListener('click', () => applyUpgrade('damage'));
        document.getElementById('btn-hp-up').addEventListener('click', () => applyUpgrade('health'));
        btnRestart.addEventListener('click', () => restartGameAfterDeath());

        function triggerJump() {
            if (player.isGrounded && !player.isDodging && player.stamina >= 10) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
                player.stamina -= 10;
            }
        }

        function triggerDodge() {
            if (player.stamina >= 25 && !player.isDodging) {
                player.isDodging = true;
                player.dodgeTimer = 18; 
                player.stamina -= 25;
            }
        }

        function triggerAttack() {
            if (player.stamina >= 15 && !player.isAttacking && !player.isDodging) {
                player.facing = boss.x >= player.x ? 1 : -1;

                player.isAttacking = true;
                player.attackTimer = 12;
                player.stamina -= 15; 

                player.comboCount++;
                player.comboTimer = 180; 
                comboDisplay.innerText = player.comboCount;

                let hitBoxWidth = 75;
                let hitBoxX = player.facing > 0 ? player.x + player.width : player.x - hitBoxWidth;
                
                if (hitBoxX < boss.x + boss.width && hitBoxX + hitBoxWidth > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    let laserDmg = (15 + stats.level * 3) * player.damageMultiplier;
                    let meleeDmg = laserDmg * 2;
                    boss.hp -= meleeDmg;
                    if (boss.hp <= 0) {
                        handleWin();
                    }
                }

                // Boss reflexively attempts a slow dodge backward when player attacks
                if (boss.state === 'IDLE' && Math.abs(boss.x - player.x) < 220) {
                    boss.state = 'DODGING';
                    let dodgeDir = boss.x >= player.x ? 1 : -1; // away from player
                    boss.vx = dodgeDir * 3.2; // slow dodge speed
                    boss.dodgeTimer = 30; // frames of backward evade
                }

                if (player.comboCount >= 4) {
                    lasers.push({
                        x: player.facing > 0 ? player.x + player.width : player.x - 25,
                        y: player.y + 16,
                        vx: player.facing * 14,
                        width: 45,
                        height: 10
                    });
                    player.comboCount = 0;
                    comboDisplay.innerText = player.comboCount;
                }
            }
        }

        function handleWin() {
            stats.wins++;
            winDisplay.innerText = stats.wins;

            if (stats.wins >= 10) {
                gameState = 'VICTORY';
                overlayTitle.innerText = "YOU WIN";
                overlayTitle.style.color = "#98c379";
                upgradeOptions.style.display = "none";
                deathTutorialText.style.display = "none";
                btnRestart.style.display = "none";
                overlayCredit.style.display = "block";
                overlayScreen.style.display = "flex";
                return;
            }

            gameState = 'WIN_PAUSE';
            overlayTitle.innerText = `Level ${stats.wins} Beaten! Choose Upgrade:`;
            overlayTitle.style.color = "#98c379";
            upgradeOptions.style.display = "flex";
            deathTutorialText.style.display = "none";
            btnRestart.style.display = "none";
            overlayCredit.style.display = "none";
            overlayScreen.style.display = "flex";
        }

        function applyUpgrade(type) {
            if (type === 'damage') {
                player.damageMultiplier += 0.5;
            } else if (type === 'health') {
                player.maxHp += 50;
                player.hp = player.maxHp; 
            }
            resumeGame();
        }

        function resumeGame() {
            overlayScreen.style.display = "none";
            stats.level++;
            boss.speedMultiplier += 0.25;
            boss.maxHp = 300 * Math.pow(2, stats.wins);
            boss.hp = boss.maxHp;
            boss.x = 650;
            boss.y = groundLevel - boss.height;
            boss.vy = 0;
            boss.state = 'IDLE';
            boss.hasDealtDamage = false;
            
            player.hp = player.maxHp;
            player.x = 100;
            player.y = groundLevel - player.height;
            player.vy = 0;
            lvlDisplay.innerText = stats.level;
            gameState = 'PLAYING';
        }

        function handleDeath() {
            stats.deaths++;
            deathDisplay.innerText = stats.deaths;

            gameState = 'DEATH';
            overlayTitle.innerText = "YOU DIE";
            overlayTitle.style.color = "#e06c75";
            upgradeOptions.style.display = "none";

            // Random Tutorial Quotes
            const tutorialQuotes = [
                "💡 **Tutorial Tip:** Keep moving! Standing still regenerates stamina quicker, but running helps you keep a safe distance from sudden boss dashes.",
                "💡 **Tutorial Tip:** Time your dodge roll (Shift or DODGE button) correctly to phase through incoming boss charges without taking damage.",
                "💡 **Tutorial Tip:** Land 4 consecutive attacks on the boss to automatically shoot a powerful ranged laser beam!",
                "💡 **Tutorial Tip:** Watch your stamina bar! Running out completely makes you move very slowly and disables jumps and dodges.",
                "💡 **Tutorial Tip:** Use the tiered pyramid platforms to jump over the boss when it corners you on the ground level.",
                "💡 **Tutorial Tip:** Want to send bug reports, feedback, or connect with the creator? Check out Ciceroyce's contact page: <a href='https://ciceroyce12-ops.github.io/Contact_Me/' target='_blank' style='color: #61afef; text-decoration: underline;'>https://ciceroyce12-ops.github.io/Contact_Me/</a>"
            ];

            const randomQuote = tutorialQuotes[Math.floor(Math.random() * tutorialQuotes.length)];
            deathTutorialText.innerHTML = randomQuote;
            deathTutorialText.style.display = "block";

            btnRestart.style.display = "block";
            overlayCredit.style.display = "none";
            overlayScreen.style.display = "flex";
        }

        function restartGameAfterDeath() {
            overlayScreen.style.display = "none";
            stats.level = 1;
            stats.wins = 0;
            winDisplay.innerText = stats.wins;
            lvlDisplay.innerText = stats.level;
            
            player.maxHp = 100;
            player.hp = player.maxHp;
            player.damageMultiplier = 1.0;
            player.stamina = player.maxStamina;
            player.x = 100;
            player.y = groundLevel - player.height;
            player.vy = 0;

            boss.speedMultiplier = 1.0;
            boss.maxHp = 300;
            boss.hp = boss.maxHp;
            boss.x = 650;
            boss.y = groundLevel - boss.height;
            boss.vy = 0;
            boss.state = 'IDLE';
            boss.hasDealtDamage = false;

            player.comboCount = 0;
            comboDisplay.innerText = player.comboCount;
            gameState = 'PLAYING';
        }

        function applyPhysics(entity) {
            entity.vy += entity.gravity;
            entity.y += entity.vy;
            entity.isGrounded = false;

            let prevY = entity.y - entity.vy;
            let feetPrev = prevY + entity.height;
            let feetCurr = entity.y + entity.height;

            // Ground collision
            if (entity.y >= groundLevel - entity.height) {
                entity.y = groundLevel - entity.height;
                entity.vy = 0;
                entity.isGrounded = true;
                return;
            }

            // Platforms collision
            platforms.forEach(plat => {
                if (entity.vy >= 0 && 
                    feetPrev <= plat.y && 
                    feetCurr >= plat.y && 
                    entity.x + entity.width > plat.x && 
                    entity.x < plat.x + plat.width) {
                    entity.y = plat.y - entity.height;
                    entity.vy = 0;
                    entity.isGrounded = true;
                }
            });
        }

        function update() {
            if (gameState !== 'PLAYING') return;

            let isMoving = (keys.left || keys.right) && !player.isDodging;

            if (isMoving) {
                player.stamina -= 0.45; 
                if (player.stamina < 0) player.stamina = 0;
            } else {
                if (player.stamina < player.maxStamina) {
                    player.stamina += 0.9; 
                    if (player.stamina > player.maxStamina) player.stamina = player.maxStamina;
                }
            }

            if (player.comboTimer > 0) {
                player.comboTimer--;
                if (player.comboTimer === 0) {
                    player.comboCount = 0;
                    comboDisplay.innerText = player.comboCount;
                }
            }

            lasers.forEach((laser, index) => {
                laser.x += laser.vx;
                if (laser.x < boss.x + boss.width && laser.x + laser.width > boss.x &&
                    laser.y < boss.y + boss.height && laser.y + laser.height > boss.y) {
                    let laserDmg = (15 + stats.level * 3) * player.damageMultiplier;
                    boss.hp -= laserDmg;
                    lasers.splice(index, 1);
                    if (boss.hp <= 0) {
                        handleWin();
                    }
                }
                if (laser.x < 0 || laser.x > canvas.width) {
                    lasers.splice(index, 1);
                }
            });

            // Apply Player Physics
            applyPhysics(player);

            if (player.isDodging) {
                player.x += player.facing * 8.5;
                player.dodgeTimer--;
                if (player.dodgeTimer <= 0) player.isDodging = false;
            } else {
                let currentSpeed = player.stamina <= 0 ? player.speed * 0.25 : player.speed;

                if (keys.left) {
                    player.x -= currentSpeed;
                    player.facing = -1;
                }
                if (keys.right) {
                    player.x += currentSpeed;
                    player.facing = 1;
                }
            }

            if (player.x < 15) player.x = 15;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            // Apply Boss Physics
            applyPhysics(boss);

            let distanceToPlayer = Math.abs(boss.x - player.x);
            let verticalDistance = Math.abs(boss.y - player.y);

            if (boss.state === 'IDLE') {
                boss.attackCooldown++;
                let moveSpeed = (1.4 + (stats.level * 0.08)) * boss.speedMultiplier;
                
                // Directly track player horizontally so the boss naturally walks off platforms to pursue on ground
                let horizontalDiff = player.x - boss.x;
                if (Math.abs(horizontalDiff) > 10) {
                    boss.x += Math.sign(horizontalDiff) * moveSpeed;
                }

                // Jump up if player is higher up
                if (player.y < boss.y - 20 && boss.isGrounded) {
                    if (Math.abs(horizontalDiff) < 200 && Math.random() < 0.08) {
                        boss.vy = boss.jumpForce;
                        boss.isGrounded = false;
                    }
                }

                if (distanceToPlayer < 120 && verticalDistance < 65 && boss.attackCooldown > Math.max(40, 80 - stats.wins * 5)) {
                    boss.state = 'CHARGING';
                    boss.telegraphTimer = Math.max(20, 35 - stats.wins * 2);
                    boss.attackCooldown = 0;
                    boss.hasDealtDamage = false; 
                }
            } 
            else if (boss.state === 'CHARGING') {
                boss.telegraphTimer--;
                if (boss.telegraphTimer <= 0) {
                    boss.state = 'ATTACKING';
                    boss.vx = (player.x > boss.x ? 1 : -1) * (11 * boss.speedMultiplier);
                }
            } 
            else if (boss.state === 'DODGING') {
                boss.x += boss.vx;
                boss.dodgeTimer--;
                boss.vx *= 0.88; // friction
                if (boss.dodgeTimer <= 0 || Math.abs(boss.vx) < 0.2) {
                    boss.vx = 0;
                    boss.state = 'IDLE';
                }
            }
            else if (boss.state === 'ATTACKING') {
                boss.x += boss.vx;
                if (player.x < boss.x + boss.width && player.x + player.width > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    let isJumpingOver = player.y + player.height < boss.y + 25; 
                    if (!player.isDodging && !isJumpingOver && !boss.hasDealtDamage) {
                        let baseDmg = 100 / 5;
                        let damageToPlayer = baseDmg * Math.pow(2, stats.wins);
                        
                        player.hp -= damageToPlayer;
                        boss.hasDealtDamage = true; 

                        if (player.hp <= 0) {
                            handleDeath();
                        }
                    }
                }
                if (Math.abs(boss.vx) > 0) {
                    boss.vx *= 0.82;
                    if (Math.abs(boss.vx) < 0.5) {
                        boss.vx = 0;
                        boss.state = 'IDLE';
                    }
                }
            }
            else if (boss.state === 'CALM') {
                boss.calmTimer--;
                if (boss.calmTimer <= 0) {
                    boss.state = 'IDLE';
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background Atmospheric Details
            ctx.fillStyle = '#171821';
            ctx.fillRect(120, 100, 30, 190);
            ctx.fillRect(450, 80, 35, 210);
            
            // --- DRAW 4-TIER PYRAMID PLATFORMS ---
            platforms.forEach(plat => {
                ctx.fillStyle = '#21252b';
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.strokeStyle = '#383a42';
                ctx.lineWidth = 2;
                ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
                ctx.strokeStyle = '#61afef';
                ctx.beginPath();
                ctx.moveTo(plat.x, plat.y);
                ctx.lineTo(plat.x + plat.width, plat.y);
                ctx.stroke();
            });

            // Ground Floor
            ctx.strokeStyle = '#3b4252';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundLevel);
            ctx.lineTo(canvas.width, groundLevel);
            ctx.stroke();

            // --- DRAW LASERS ---
            lasers.forEach(laser => {
                ctx.fillStyle = 'rgba(97, 175, 239, 0.4)';
                ctx.fillRect(laser.x - 4, laser.y - 4, laser.width + 8, laser.height + 8);
                ctx.fillStyle = '#61afef';
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(laser.x, laser.y + 3, laser.width, 4);
            });

            // --- DRAW CUSTOM PLAYER SPRITE ---
            ctx.save();
            ctx.translate(player.x, player.y);
            
            if (player.isDodging) {
                ctx.fillStyle = 'rgba(97, 175, 239, 0.4)';
                ctx.fillRect(-6, 0, player.width, player.height);
            }

            if (player.stamina <= 0) {
                ctx.fillStyle = '#e06c75'; 
            } else {
                ctx.fillStyle = player.isAttacking ? '#d19a66' : '#98c379';
            }
            ctx.fillRect(4, 14, 20, 22);
            ctx.fillStyle = '#5c6370';
            ctx.fillRect(4, 2, 20, 14);
            ctx.fillStyle = '#61afef';
            let visorX = player.facing > 0 ? 14 : 6;
            ctx.fillRect(visorX, 6, 8, 3);

            if (player.isAttacking) {
                ctx.fillStyle = '#ffffff';
                let swordX = player.facing > 0 ? 24 : -45;
                ctx.fillRect(swordX, 16, 45, 6);
                ctx.fillStyle = 'rgba(97, 175, 239, 0.6)';
                ctx.fillRect(swordX - 4, 12, 53, 14);
            }
            ctx.restore();

            // --- DRAW CUSTOM BOSS SPRITE ---
            ctx.save();
            ctx.translate(boss.x, boss.y);

            if (boss.state === 'CHARGING') {
                ctx.fillStyle = '#e06c75'; 
            } else if (boss.state === 'ATTACKING') {
                ctx.fillStyle = '#be5046';
            } else if (boss.state === 'DODGING') {
                ctx.fillStyle = '#e5c07b'; 
            } else {
                ctx.fillStyle = '#4b5263'; // Normal boss grey color for IDLE and CALM (no green window)
            }
            ctx.fillRect(6, 12, 36, 53);

            ctx.fillStyle = '#abb2bf';
            ctx.beginPath();
            ctx.moveTo(6, 12); ctx.lineTo(0, 0); ctx.lineTo(12, 12);
            ctx.moveTo(42, 12); ctx.lineTo(48, 0); ctx.lineTo(36, 12);
            ctx.fill();

            ctx.fillStyle = boss.state === 'CHARGING' ? '#ffffff' : '#e06c75';
            ctx.fillRect(14, 20, 8, 4);
            ctx.fillRect(26, 20, 8, 4);

            ctx.fillStyle = '#21252b';
            ctx.fillRect(boss.x > player.x ? -14 : 42, 25, 14, 35);

            ctx.restore();

            // --- UI BARS ---
            ctx.fillStyle = '#21252b';
            ctx.fillRect(20, 20, 160, 12);
            ctx.fillStyle = '#98c379';
            ctx.fillRect(20, 20, Math.max(0, (player.hp / player.maxHp) * 160), 12);
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText(`HP: ${Math.max(0, Math.floor(player.hp))}/${player.maxHp}`, 25, 30);

            ctx.fillStyle = '#21252b';
            ctx.fillRect(20, 36, 110, 8);
            ctx.fillStyle = player.stamina <= 0 ? '#e06c75' : '#e5c07b';
            ctx.fillRect(20, 36, (player.stamina / player.maxStamina) * 110, 8);

            ctx.fillStyle = '#21252b';
            ctx.fillRect(canvas.width - 180, 20, 160, 12);
            ctx.fillStyle = '#e06c75';
            ctx.fillRect(canvas.width - 180, 20, Math.max(0, (boss.hp / boss.maxHp) * 160), 12);
            ctx.fillStyle = '#fff';
            ctx.fillText(`BOSS HP (Tier ${stats.wins + 1})`, canvas.width - 150, 30);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
