<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Souls-Like Mini RPG - Custom Sprites</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #0b0b0e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .header-container {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #e06c75;
            text-transform: uppercase;
        }
        #stats {
            font-size: 0.8rem;
            color: #9da5b4;
            margin-top: 3px;
        }
        canvas {
            border: 3px solid #282c34;
            background: linear-gradient(to bottom, #121318, #1a1b24);
            box-shadow: 0 0 30px rgba(224, 108, 117, 0.15);
            max-width: 98vw;
            height: auto;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 10px;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }
        button {
            background-color: #21252b;
            color: white;
            border: 1px solid #383a42;
            padding: 12px 0;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }
        button:active {
            background-color: #383a42;
        }
        .btn-jump { background-color: #4c412b; }
        .btn-dodge { background-color: #294966; }
        .btn-attack { background-color: #662929; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Trial by Death: Custom Sprites Edition</h1>
        <div id="stats">Level: <span id="lvl-display">1</span> | Wins: <span id="win-display">0</span> | Deaths: <span id="death-display">0</span></div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="350"></canvas>

    <div class="controls">
        <button id="btn-left">←</button>
        <button id="btn-right">→</button>
        <button id="btn-jump" class="btn-jump">JUMP</button>
        <button id="btn-dodge" class="btn-dodge">DODGE</button>
        <button id="btn-attack" class="btn-attack">HIT</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lvlDisplay = document.getElementById('lvl-display');
        const winDisplay = document.getElementById('win-display');
        const deathDisplay = document.getElementById('death-display');

        let stats = {
            level: 1,
            wins: 0,
            deaths: 0
        };

        const groundLevel = 290;

        const player = {
            x: 100,
            y: groundLevel - 40,
            width: 28,
            height: 42,
            speed: 4.5,
            vy: 0,
            gravity: 0.55,
            jumpForce: -11,
            isGrounded: true,
            hp: 100,
            maxHp: 100,
            stamina: 100,
            maxStamina: 100,
            isDodging: false,
            dodgeTimer: 0,
            isAttacking: false,
            attackTimer: 0,
            facing: 1
        };

        const boss = {
            x: 650,
            y: groundLevel - 65,
            width: 48,
            height: 65,
            hp: 300,
            maxHp: 300,
            attackCooldown: 0,
            state: 'IDLE', 
            telegraphTimer: 0,
            vx: 0,
            speedMultiplier: 1.0
        };

        let keys = { left: false, right: false };

        // Input Listeners (Keyboard)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') triggerJump();
            if (e.key === ' ' || e.key === 'Shift') triggerDodge();
            if (e.key === 'j' || e.key === 'Enter') triggerAttack();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        // Touch Listeners (Mobile)
        document.getElementById('btn-left').addEventListener('touchstart', () => keys.left = true);
        document.getElementById('btn-left').addEventListener('touchend', () => keys.left = false);
        document.getElementById('btn-right').addEventListener('touchstart', () => keys.right = true);
        document.getElementById('btn-right').addEventListener('touchend', () => keys.right = false);
        document.getElementById('btn-jump').addEventListener('click', triggerJump);
        document.getElementById('btn-dodge').addEventListener('click', triggerDodge);
        document.getElementById('btn-attack').addEventListener('click', triggerAttack);

        function triggerJump() {
            if (player.isGrounded && !player.isDodging && player.stamina >= 10) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
                player.stamina -= 10;
            }
        }

        function triggerDodge() {
            if (player.stamina >= 25 && !player.isDodging) {
                player.isDodging = true;
                player.dodgeTimer = 18; 
                player.stamina -= 25;
            }
        }

        function triggerAttack() {
            if (player.stamina >= 15 && !player.isAttacking && !player.isDodging) {
                // Auto-aim: Face boss instantly
                player.facing = boss.x >= player.x ? 1 : -1;

                player.isAttacking = true;
                player.attackTimer = 12;
                player.stamina -= 15;

                let hitBoxWidth = 50;
                let hitBoxX = player.facing > 0 ? player.x + player.width : player.x - hitBoxWidth;
                
                if (hitBoxX < boss.x + boss.width && hitBoxX + hitBoxWidth > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    boss.hp -= (15 + stats.level * 3);
                    if (boss.hp <= 0) {
                        handleWin();
                    }
                }
            }
        }

        function handleWin() {
            stats.wins++;
            stats.level++;
            boss.speedMultiplier += 0.25;
            boss.maxHp = 300 + (stats.wins * 120);
            boss.hp = boss.maxHp;
            boss.x = 650;
            winDisplay.innerText = stats.wins;
            lvlDisplay.innerText = stats.level;
        }

        function handleDeath() {
            stats.deaths++;
            stats.level++;
            player.hp = player.maxHp + (stats.level * 10);
            player.maxHp = player.hp;
            player.x = 100;
            boss.hp = boss.maxHp;
            lvlDisplay.innerText = stats.level;
            deathDisplay.innerText = stats.deaths;
        }

        function update() {
            if (player.stamina < player.maxStamina) {
                player.stamina += 0.85;
            }

            player.vy += player.gravity;
            player.y += player.vy;
            if (player.y >= groundLevel - player.height) {
                player.y = groundLevel - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            if (player.isDodging) {
                player.x += player.facing * 8.5;
                player.dodgeTimer--;
                if (player.dodgeTimer <= 0) player.isDodging = false;
            } else {
                if (keys.left) player.x -= player.speed;
                if (keys.right) player.x += player.speed;
            }

            if (player.x < 15) player.x = 15;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            if (boss.state === 'IDLE') {
                boss.attackCooldown++;
                let moveSpeed = (1.4 + (stats.level * 0.08)) * boss.speedMultiplier;
                
                if (boss.x > player.x + 70) boss.x -= moveSpeed;
                else if (boss.x < player.x - 70) boss.x += moveSpeed;

                if (boss.attackCooldown > Math.max(30, 70 - stats.wins * 5)) {
                    boss.state = 'CHARGING';
                    boss.telegraphTimer = Math.max(15, 30 - stats.wins * 2);
                    boss.attackCooldown = 0;
                }
            } else if (boss.state === 'CHARGING') {
                boss.telegraphTimer--;
                if (boss.telegraphTimer <= 0) {
                    boss.state = 'ATTACKING';
                    boss.vx = (player.x > boss.x ? 1 : -1) * (10 * boss.speedMultiplier);
                }
            } else if (boss.state === 'ATTACKING') {
                boss.x += boss.vx;
                if (player.x < boss.x + boss.width && player.x + player.width > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    let isJumpingOver = player.y + player.height < boss.y + 25; 
                    if (!player.isDodging && !isJumpingOver) {
                        player.hp -= (45 + stats.level * 6);
                        if (player.hp <= 0) {
                            handleDeath();
                        }
                    }
                }
                if (Math.abs(boss.vx) > 0) {
                    boss.vx *= 0.85;
                    if (Math.abs(boss.vx) < 0.5) boss.state = 'IDLE';
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Atmospheric Details (Ruins / Pillars)
            ctx.fillStyle = '#171821';
            ctx.fillRect(120, 100, 30, 190);
            ctx.fillRect(450, 80, 35, 210);
            
            // Ground Floor
            ctx.strokeStyle = '#3b4252';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundLevel);
            ctx.lineTo(canvas.width, groundLevel);
            ctx.stroke();

            // --- DRAW CUSTOM PLAYER SPRITE ---
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // If dodging, render glowing blue blur trail
            if (player.isDodging) {
                ctx.fillStyle = 'rgba(97, 175, 239, 0.4)';
                ctx.fillRect(-6, 0, player.width, player.height);
            }

            // Body / Cloak
            ctx.fillStyle = player.isAttacking ? '#d19a66' : '#98c379';
            ctx.fillRect(4, 14, 20, 22);
            // Helmet / Hood
            ctx.fillStyle = '#5c6370';
            ctx.fillRect(4, 2, 20, 14);
            // Visor Glow
            ctx.fillStyle = '#61afef';
            let visorX = player.facing > 0 ? 14 : 6;
            ctx.fillRect(visorX, 6, 8, 3);

            // Weapon / Sword
            if (player.isAttacking) {
                ctx.fillStyle = '#ffffff';
                let swordX = player.facing > 0 ? 24 : -18;
                ctx.fillRect(swordX, 16, 22, 6);
                // Slash Glow Aura
                ctx.fillStyle = 'rgba(97, 175, 239, 0.6)';
                ctx.fillRect(swordX - 4, 12, 30, 14);
            }
            ctx.restore();

            // --- DRAW CUSTOM BOSS SPRITE ---
            ctx.save();
            ctx.translate(boss.x, boss.y);

            // Boss Armor Frame
            if (boss.state === 'CHARGING') {
                ctx.fillStyle = '#e06c75'; // Danger Red Flash
            } else if (boss.state === 'ATTACKING') {
                ctx.fillStyle = '#be5046';
            } else {
                ctx.fillStyle = '#4b5263'; // Dark Iron Knight
            }
            ctx.fillRect(6, 12, 36, 53);

            // Boss Horns / Spikes
            ctx.fillStyle = '#abb2bf';
            ctx.beginPath();
            ctx.moveTo(6, 12); ctx.lineTo(0, 0); ctx.lineTo(12, 12);
            ctx.moveTo(42, 12); ctx.lineTo(48, 0); ctx.lineTo(36, 12);
            ctx.fill();

            // Boss Visor / Glowing Eyes
            ctx.fillStyle = boss.state === 'CHARGING' ? '#ffffff' : '#e06c75';
            ctx.fillRect(14, 20, 8, 4);
            ctx.fillRect(26, 20, 8, 4);

            // Boss Greatsword
            ctx.fillStyle = '#21252b';
            ctx.fillRect(boss.x > player.x ? -14 : 42, 25, 14, 35);

            ctx.restore();

            // --- UI BARS ---
            // Player HP
            ctx.fillStyle = '#21252b';
            ctx.fillRect(20, 20, 160, 12);
            ctx.fillStyle = '#98c379';
            ctx.fillRect(20, 20, Math.max(0, (player.hp / player.maxHp) * 160), 12);
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText(`HP: ${Math.max(0, Math.floor(player.hp))}`, 25, 30);

            // Player Stamina
            ctx.fillStyle = '#21252b';
            ctx.fillRect(20, 36, 110, 8);
            ctx.fillStyle = '#e5c07b';
            ctx.fillRect(20, 36, (player.stamina / player.maxStamina) * 110, 8);

            // Boss HP
            ctx.fillStyle = '#21252b';
            ctx.fillRect(canvas.width - 180, 20, 160, 12);
            ctx.fillStyle = '#e06c75';
            ctx.fillRect(canvas.width - 180, 20, Math.max(0, (boss.hp / boss.maxHp) * 160), 12);
            ctx.fillStyle = '#fff';
            ctx.fillText(`BOSS HP (Tier ${stats.wins + 1})`, canvas.width - 150, 30);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
