<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Souls-Like Mini RPG - Fixed Damage & Level Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
        }
        body {
            background-color: #0b0b0e;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .header-container {
            text-align: center;
            margin-bottom: 5px;
        }
        h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            color: #e06c75;
            text-transform: uppercase;
        }
        #stats {
            font-size: 0.8rem;
            color: #9da5b4;
            margin-top: 3px;
        }
        canvas {
            border: 3px solid #282c34;
            background: linear-gradient(to bottom, #121318, #1a1b24);
            box-shadow: 0 0 30px rgba(224, 108, 117, 0.15);
            max-width: 98vw;
            height: auto;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-top: 10px;
            width: 100%;
            max-width: 500px;
            padding: 0 10px;
        }
        button {
            background-color: #21252b;
            color: white;
            border: 1px solid #383a42;
            padding: 12px 0;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }
        button:active {
            background-color: #383a42;
        }
        .btn-jump { background-color: #4c412b; }
        .btn-dodge { background-color: #294966; }
        .btn-attack { background-color: #662929; }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Trial by Death: Fixed Balance Edition</h1>
        <div id="stats">Level: <span id="lvl-display">1</span> | Wins: <span id="win-display">0</span> | Deaths: <span id="death-display">0</span> | Combo: <span id="combo-display">0</span>/4</div>
    </div>
    
    <canvas id="gameCanvas" width="800" height="350"></canvas>

    <div class="controls">
        <button id="btn-left">←</button>
        <button id="btn-right">→</button>
        <button id="btn-jump" class="btn-jump">JUMP</button>
        <button id="btn-dodge" class="btn-dodge">DODGE</button>
        <button id="btn-attack" class="btn-attack">HIT</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lvlDisplay = document.getElementById('lvl-display');
        const winDisplay = document.getElementById('win-display');
        const deathDisplay = document.getElementById('death-display');
        const comboDisplay = document.getElementById('combo-display');

        let stats = {
            level: 1,
            wins: 0,
            deaths: 0
        };

        const groundLevel = 290;

        const player = {
            x: 100,
            y: groundLevel - 40,
            width: 28,
            height: 42,
            speed: 4.5,
            vy: 0,
            gravity: 0.55,
            jumpForce: -11,
            isGrounded: true,
            hp: 100,
            maxHp: 100,
            stamina: 100,
            maxStamina: 100,
            isDodging: false,
            dodgeTimer: 0,
            isAttacking: false,
            attackTimer: 0,
            facing: 1,
            comboCount: 0,
            comboTimer: 0
        };

        const boss = {
            x: 650,
            y: groundLevel - 65,
            width: 48,
            height: 65,
            hp: 300,
            maxHp: 300,
            attackCooldown: 0,
            state: 'IDLE', // IDLE (pursuing), CHARGING, ATTACKING, CALM
            telegraphTimer: 0,
            calmTimer: 0,
            vx: 0,
            speedMultiplier: 1.0,
            hasDealtDamage: false
        };

        let lasers = [];
        let keys = { left: false, right: false };

        // Input Listeners (Keyboard)
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w') triggerJump();
            if (e.key === ' ' || e.key === 'Shift') triggerDodge();
            if (e.key === 'j' || e.key === 'Enter') triggerAttack();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        // Touch Listeners (Mobile)
        document.getElementById('btn-left').addEventListener('touchstart', () => keys.left = true);
        document.getElementById('btn-left').addEventListener('touchend', () => keys.left = false);
        document.getElementById('btn-right').addEventListener('touchstart', () => keys.right = true);
        document.getElementById('btn-right').addEventListener('touchend', () => keys.right = false);
        document.getElementById('btn-jump').addEventListener('click', triggerJump);
        document.getElementById('btn-dodge').addEventListener('click', triggerDodge);
        document.getElementById('btn-attack').addEventListener('click', triggerAttack);

        function triggerJump() {
            if (player.isGrounded && !player.isDodging && player.stamina >= 10) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
                player.stamina -= 10;
            }
        }

        function triggerDodge() {
            if (player.stamina >= 25 && !player.isDodging) {
                player.isDodging = true;
                player.dodgeTimer = 18; 
                player.stamina -= 25;
            }
        }

        function triggerAttack() {
            if (player.stamina >= 15 && !player.isAttacking && !player.isDodging) {
                // Auto-aim: Face boss instantly
                player.facing = boss.x >= player.x ? 1 : -1;

                player.isAttacking = true;
                player.attackTimer = 12;
                player.stamina -= 15; // Attack consumes stamina

                // Combo Tracking
                player.comboCount++;
                player.comboTimer = 90; // 1.5 second combo window
                comboDisplay.innerText = player.comboCount;

                // Check 50% Increased Reach Hitbox (75 width)
                let hitBoxWidth = 75;
                let hitBoxX = player.facing > 0 ? player.x + player.width : player.x - hitBoxWidth;
                
                if (hitBoxX < boss.x + boss.width && hitBoxX + hitBoxWidth > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    boss.hp -= (15 + stats.level * 3);
                    if (boss.hp <= 0) {
                        handleWin();
                    }
                }

                // Shoot laser from afar on every 4th attack (regardless of whether it hit or missed)
                if (player.comboCount >= 4) {
                    lasers.push({
                        x: player.facing > 0 ? player.x + player.width : player.x - 20,
                        y: player.y + 14,
                        vx: player.facing * 12,
                        width: 35,
                        height: 10
                    });
                    player.comboCount = 0;
                    comboDisplay.innerText = player.comboCount;
                }
            }
        }

        function handleWin() {
            stats.wins++;
            stats.level++;
            boss.speedMultiplier += 0.25;
            boss.maxHp = 300 + (stats.wins * 120);
            boss.hp = boss.maxHp;
            boss.x = 650;
            boss.state = 'IDLE';
            winDisplay.innerText = stats.wins;
            lvlDisplay.innerText = stats.level;
        }

        function handleDeath() {
            stats.deaths++;
            // Level stays the same when you die (removed stats.level++)
            player.hp = player.maxHp;
            player.x = 100;
            boss.hp = boss.maxHp;
            boss.state = 'IDLE';
            deathDisplay.innerText = stats.deaths;
            player.comboCount = 0;
            comboDisplay.innerText = player.comboCount;
        }

        function update() {
            let isMoving = (keys.left || keys.right) && !player.isDodging;

            // Stamina Consumption & Recovery Logic
            if (isMoving) {
                player.stamina -= 0.45; // Moving consumes stamina
                if (player.stamina < 0) player.stamina = 0;
            } else {
                if (player.stamina < player.maxStamina) {
                    player.stamina += 0.9; 
                    if (player.stamina > player.maxStamina) player.stamina = player.maxStamina;
                }
            }

            // Combo decay timer
            if (player.comboTimer > 0) {
                player.comboTimer--;
                if (player.comboTimer === 0) {
                    player.comboCount = 0;
                    comboDisplay.innerText = player.comboCount;
                }
            }

            // Update Lasers (Ranged Capability)
            lasers.forEach((laser, index) => {
                laser.x += laser.vx;
                if (laser.x < boss.x + boss.width && laser.x + laser.width > boss.x &&
                    laser.y < boss.y + boss.height && laser.y + laser.height > boss.y) {
                    boss.hp -= (30 + stats.level * 5);
                    lasers.splice(index, 1);
                    if (boss.hp <= 0) {
                        handleWin();
                    }
                }
                if (laser.x < 0 || laser.x > canvas.width) {
                    lasers.splice(index, 1);
                }
            });

            player.vy += player.gravity;
            player.y += player.vy;
            if (player.y >= groundLevel - player.height) {
                player.y = groundLevel - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            // Movement & Exhaustion Speed Penalty (25% speed if stamina is 0)
            if (player.isDodging) {
                player.x += player.facing * 8.5;
                player.dodgeTimer--;
                if (player.dodgeTimer <= 0) player.isDodging = false;
            } else {
                let currentSpeed = player.stamina <= 0 ? player.speed * 0.25 : player.speed;

                if (keys.left) {
                    player.x -= currentSpeed;
                    player.facing = -1;
                }
                if (keys.right) {
                    player.x += currentSpeed;
                    player.facing = 1;
                }
            }

            if (player.x < 15) player.x = 15;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            // --- REFINED BOSS AI ---
            let distanceToPlayer = Math.abs(boss.x - player.x);

            if (boss.state === 'IDLE') {
                boss.attackCooldown++;
                let moveSpeed = (1.4 + (stats.level * 0.08)) * boss.speedMultiplier;
                
                // Pursue player if not close enough
                if (boss.x > player.x + 60) boss.x -= moveSpeed;
                else if (boss.x < player.x - 60) boss.x += moveSpeed;

                // Only start charging an attack if close enough to the player and cooldown is ready
                if (distanceToPlayer < 120 && boss.attackCooldown > Math.max(40, 80 - stats.wins * 5)) {
                    boss.state = 'CHARGING';
                    boss.telegraphTimer = Math.max(20, 35 - stats.wins * 2);
                    boss.attackCooldown = 0;
                    boss.hasDealtDamage = false; // Reset hit flag for the new attack
                }
            } 
            else if (boss.state === 'CHARGING') {
                boss.telegraphTimer--;
                if (boss.telegraphTimer <= 0) {
                    boss.state = 'ATTACKING';
                    boss.vx = (player.x > boss.x ? 1 : -1) * (11 * boss.speedMultiplier);
                }
            } 
            else if (boss.state === 'ATTACKING') {
                boss.x += boss.vx;
                if (player.x < boss.x + boss.width && player.x + player.width > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    let isJumpingOver = player.y + player.height < boss.y + 25; 
                    if (!player.isDodging && !isJumpingOver && !boss.hasDealtDamage) {
                        // Level 1 = 10 hits to die (10 damage). Each win reduces allowed hits by 1 (down to min 2 hits).
                        let allowedHits = Math.max(2, 10 - stats.wins);
                        let damageToPlayer = player.maxHp / allowedHits;
                        
                        player.hp -= damageToPlayer;
                        boss.hasDealtDamage = true; // Ensure boss only deals damage ONCE per attack swoop

                        if (player.hp <= 0) {
                            handleDeath();
                        }
                    }
                }
                if (Math.abs(boss.vx) > 0) {
                    boss.vx *= 0.82;
                    // Once attack momentum stops, enter CALM state for 1 second (60 frames)
                    if (Math.abs(boss.vx) < 0.5) {
                        boss.vx = 0;
                        boss.state = 'CALM';
                        boss.calmTimer = 60; // 1 second vulnerability window
                    }
                }
            } 
            else if (boss.state === 'CALM') {
                // Boss is calm/resting after attacking, giving the player a clear window to hit it
                boss.calmTimer--;
                if (boss.calmTimer <= 0) {
                    boss.state = 'IDLE';
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background Atmospheric Details
            ctx.fillStyle = '#171821';
            ctx.fillRect(120, 100, 30, 190);
            ctx.fillRect(450, 80, 35, 210);
            
            // Ground Floor
            ctx.strokeStyle = '#3b4252';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundLevel);
            ctx.lineTo(canvas.width, groundLevel);
            ctx.stroke();

            // --- DRAW LASERS ---
            ctx.fillStyle = '#61afef';
            lasers.forEach(laser => {
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
                ctx.fillStyle = 'rgba(97, 175, 239, 0.4)';
                ctx.fillRect(laser.x - 2, laser.y - 2, laser.width + 4, laser.height + 4);
                ctx.fillStyle = '#61afef';
            });

            // --- DRAW CUSTOM PLAYER SPRITE ---
            ctx.save();
            ctx.translate(player.x, player.y);
            
            if (player.isDodging) {
                ctx.fillStyle = 'rgba(97, 175, 239, 0.4)';
                ctx.fillRect(-6, 0, player.width, player.height);
            }

            if (player.stamina <= 0) {
                ctx.fillStyle = '#e06c75'; // Exhausted indicator
            } else {
                ctx.fillStyle = player.isAttacking ? '#d19a66' : '#98c379';
            }
            ctx.fillRect(4, 14, 20, 22);
            ctx.fillStyle = '#5c6370';
            ctx.fillRect(4, 2, 20, 14);
            ctx.fillStyle = '#61afef';
            let visorX = player.facing > 0 ? 14 : 6;
            ctx.fillRect(visorX, 6, 8, 3);

            // Extended Weapon Reach Slash FX
            if (player.isAttacking) {
                ctx.fillStyle = '#ffffff';
                let swordX = player.facing > 0 ? 24 : -45;
                ctx.fillRect(swordX, 16, 45, 6);
                ctx.fillStyle = 'rgba(97, 175, 239, 0.6)';
                ctx.fillRect(swordX - 4, 12, 53, 14);
            }
            ctx.restore();

            // --- DRAW CUSTOM BOSS SPRITE ---
            ctx.save();
            ctx.translate(boss.x, boss.y);

            if (boss.state === 'CHARGING') {
                ctx.fillStyle = '#e06c75'; // Danger Red Flash
            } else if (boss.state === 'ATTACKING') {
                ctx.fillStyle = '#be5046';
            } else if (boss.state === 'CALM') {
                ctx.fillStyle = '#98c379'; // Greenish tint showing vulnerability/calm window
            } else {
                ctx.fillStyle = '#4b5263'; // Normal Pursuing
            }
            ctx.fillRect(6, 12, 36, 53);

            ctx.fillStyle = '#abb2bf';
            ctx.beginPath();
            ctx.moveTo(6, 12); ctx.lineTo(0, 0); ctx.lineTo(12, 12);
            ctx.moveTo(42, 12); ctx.lineTo(48, 0); ctx.lineTo(36, 12);
            ctx.fill();

            ctx.fillStyle = boss.state === 'CHARGING' ? '#ffffff' : '#e06c75';
            ctx.fillRect(14, 20, 8, 4);
            ctx.fillRect(26, 20, 8, 4);

            ctx.fillStyle = '#21252b';
            ctx.fillRect(boss.x > player.x ? -14 : 42, 25, 14, 35);

            ctx.restore();

            // --- UI BARS ---
            ctx.fillStyle = '#21252b';
            ctx.fillRect(20, 20, 160, 12);
            ctx.fillStyle = '#98c379';
            ctx.fillRect(20, 20, Math.max(0, (player.hp / player.maxHp) * 160), 12);
            ctx.fillStyle = '#fff';
            ctx.font = '10px sans-serif';
            ctx.fillText(`HP: ${Math.max(0, Math.floor(player.hp))}`, 25, 30);

            ctx.fillStyle = '#21252b';
            ctx.fillRect(20, 36, 110, 8);
            ctx.fillStyle = player.stamina <= 0 ? '#e06c75' : '#e5c07b';
            ctx.fillRect(20, 36, (player.stamina / player.maxStamina) * 110, 8);

            ctx.fillStyle = '#21252b';
            ctx.fillRect(canvas.width - 180, 20, 160, 12);
            ctx.fillStyle = '#e06c75';
            ctx.fillRect(canvas.width - 180, 20, Math.max(0, (boss.hp / boss.maxHp) * 160), 12);
            ctx.fillStyle = '#fff';
            ctx.fillText(`BOSS HP (Tier ${stats.wins + 1})`, canvas.width - 150, 30);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
