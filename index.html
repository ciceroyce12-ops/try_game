<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Souls-Like Mini RPG - Responsive Edition</title>
    <style>
        * {
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            background-color: #120d09;
            color: #e0d0c0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow-x: hidden;
        }
        .header-container {
            text-align: center;
            margin-bottom: 6px;
            width: 100%;
        }
        h1 {
            margin: 0;
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #d4af37;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.4);
        }
        #stats {
            font-size: 0.8rem;
            color: #b89768;
            margin-top: 3px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 400px; /* Default mobile portrait size */
            display: flex;
            justify-content: center;
            transition: max-width 0.3s ease;
        }
        canvas {
            border: 2px solid #3d2b1f;
            background: linear-gradient(to bottom, #2b1d14, #18100b);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.2);
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }
        /* Overlay Screen (Start, Upgrades, Victory, Death) */
        #overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 13, 9, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 10;
            padding: 15px;
            border-radius: 6px;
        }
        #overlay-screen h2 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }
        #overlay-screen p {
            margin: 0 0 15px 0;
            font-size: 0.95rem;
            color: #b89768;
        }
        .upgrade-container {
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 280px;
        }
        .btn-upgrade {
            background-color: #2b1d14;
            color: #e0d0c0;
            border: 2px solid #d4af37;
            padding: 10px 15px;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .btn-upgrade:active {
            background-color: #d4af37;
            color: #120d09;
        }
        #death-tutorial-text {
            font-size: 0.85rem;
            color: #c8b090;
            max-width: 320px;
            line-height: 1.3;
            margin: 0 0 15px 0;
            display: none;
            background: #1e140e;
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px dashed #543d2b;
            text-align: left;
        }
        #btn-action {
            background-color: #d4af37;
            color: #120d09;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
            display: block;
            margin-top: 10px;
        }
        #btn-action:active {
            background-color: #b89768;
        }
        
        /* Mobile Portrait Touch Controls */
        .controls-wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
            padding: 0 2px;
            gap: 8px;
        }
        .control-group {
            display: flex;
            gap: 6px;
            flex: 1;
        }
        .control-group.actions {
            flex: 1.4;
        }
        button.control-btn {
            background-color: #21160f;
            color: #e0d0c0;
            border: 1px solid #453224;
            padding: 20px 0;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }
        button.control-btn:active {
            background-color: #453224;
        }
        .btn-jump { background-color: #382c1d; border-color: #634d31; }
        .btn-dodge { background-color: #1c2c38; border-color: #315263; }
        .btn-attack { background-color: #481d1d; border-color: #733131; }

        /* Desktop Instructions Banner */
        .desktop-instructions {
            display: none;
            margin-top: 12px;
            text-align: center;
            font-size: 0.85rem;
            color: #b89768;
            background: #1e140e;
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid #3d2b1f;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* PC / Desktop Responsive Media Query */
        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
            h1 {
                font-size: 1.4rem;
            }
            #stats {
                font-size: 0.9rem;
            }
            .canvas-container {
                max-width: 760px; /* Much larger and immersive on PC */
            }
            .controls-wrapper {
                display: none; /* Hide mobile touch buttons on desktop */
            }
            .desktop-instructions {
                display: block; /* Show keyboard controls on desktop */
            }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Colosseum of Fools</h1>
        <div id="stats">Lvl: <span id="lvl-display">1</span> | Wins: <span id="win-display">0</span>/10 | Deaths: <span id="death-display">0</span> | Combo: <span id="combo-display">0</span>/4</div>
    </div>
    
    <div class="canvas-container">
        <canvas id="gameCanvas" width="800" height="350"></canvas>
        <div id="overlay-screen">
            <h2 id="overlay-title" style="color: #d4af37;">Colosseum of Fools</h2>
            <p id="overlay-desc">Enter the arena and survive the champion trials.</p>
            <div id="upgrade-options" class="upgrade-container">
                <button class="btn-upgrade" id="btn-dmg-up">⚔️ UPGRADE DAMAGE (+50%)</button>
                <button class="btn-upgrade" id="btn-hp-up">🛡️ UPGRADE HEALTH (+50 HP & Heal)</button>
                <button class="btn-upgrade" id="btn-stamina-up">⚡ UPGRADE STAMINA (+15 & Refill)</button>
            </div>
            <div id="death-tutorial-text"></div>
            <button id="btn-action">START GAME</button>
            <p id="overlay-credit" style="margin-top: 15px; font-size: 0.85rem; color: #8a6f52;">made by Ciceroyce</p>
        </div>
    </div>

    <!-- Mobile Portrait Touch Controls -->
    <div class="controls-wrapper">
        <div class="control-group">
            <button id="btn-left" class="control-btn">←</button>
            <button id="btn-right" class="control-btn">→</button>
        </div>
        <div class="control-group actions">
            <button id="btn-jump" class="control-btn btn-jump">JUMP</button>
            <button id="btn-dodge" class="control-btn btn-dodge">DODGE</button>
            <button id="btn-attack" class="control-btn btn-attack">HIT</button>
        </div>
    </div>

    <!-- PC Keyboard Guide -->
    <div class="desktop-instructions">
        ⌨️ **Controls:** Move: <b>A / D</b> or <b>Arrow Keys</b> | Jump: <b>W / Up / Space</b> | Dodge: <b>Shift</b> | Attack: <b>J / Enter</b>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lvlDisplay = document.getElementById('lvl-display');
        const winDisplay = document.getElementById('win-display');
        const deathDisplay = document.getElementById('death-display');
        const comboDisplay = document.getElementById('combo-display');
        const overlayScreen = document.getElementById('overlay-screen');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const overlayCredit = document.getElementById('overlay-credit');
        const upgradeOptions = document.getElementById('upgrade-options');
        const deathTutorialText = document.getElementById('death-tutorial-text');
        const btnAction = document.getElementById('btn-action');

        let stats = {
            level: 1,
            wins: 0,
            deaths: 0
        };

        let gameState = 'START'; 
        let winDelayTimer = 0;
        let cutsceneTimer = 0;
        let deathAnimTimer = 0;
        
        let crowdTimer = 0;
        let activeCrowdText = "";

        // Hit-Stop (Hitlag) State
        let hitStopFrames = 0;

        // Particle System Array & Helper
        let particles = [];

        function spawnParticles(x, y, type, count) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 4 + 1;
                let color = '#d4af37';
                if (type === 'blood') {
                    color = Math.random() > 0.5 ? '#e06c75' : '#be5046';
                } else if (type === 'spark') {
                    color = '#ffe599';
                } else if (type === 'dust') {
                    color = '#8a6f52';
                    angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI;
                    speed = Math.random() * 2 + 0.5;
                }
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - (type === 'dust' ? 1 : 0),
                    size: Math.random() * 4 + 2,
                    color: color,
                    alpha: 1.0,
                    life: 0,
                    maxLife: Math.random() * 20 + 15,
                    type: type
                });
            }
        }

        // Screen Shake State
        let shakeTimer = 0;
        let shakeIntensity = 8;

        // Visual Trail / Ghost Effect Array
        let playerTrail = [];

        // Ground tracking for landing dust clouds
        let playerWasGrounded = true;
        let bossWasGrounded = true;

        // Expanded Random Dialogues
        const mockDialogues = [
            "🗣️ 'HA HA HA! PATHETIC WORM!'",
            "🗣️ 'WAKE UP OR DIE ALREADY!'",
            "🗣️ 'THAT'S IT? MY GRANDMA FIGHTS HARDER!'",
            "🗣️ 'ANOTHER EASY MEAL FOR THE ARENA!'",
            "🗣️ 'BOOOOO! GET OFF THE FLOOR!'",
            "🗣️ 'LOOK AT HIM SQUIRM! DISGUSTING!'",
            "🗣️ 'TAKE THAT, YOU CLOWN!'",
            "🗣️ 'THE FLOOR SAYS HELLO!'"
        ];

        const winDialogues = [
            "🗣️ 'UNBELIEVABLE! A NEW CHAMPION RISES?!'",
            "🗣️ 'BY THE GODS... THE BEAST HAS FALLEN!'",
            "🗣️ 'WHO IS THIS ABSOLUTE LEGEND?!'",
            "🗣️ 'GLORY TO THE NEW HERO OF THE COLOSSEUM!'",
            "🗣️ 'I-I CANNOT BELIEVE MY EYES... HE WON?!'",
            "🗣️ 'THE KING IS DEAD! ALL HAIL THE CHAMPION!'",
            "🗣️ 'A GLORIOUS UPSET! INCREDIBLE!'",
            "🗣️ 'WE EAT LIKE KINGS TONIGHT! WHAT A FIGHT!'"
        ];

        const loseDialogues = [
            "🗣️ 'ANOTHER SOUL CLAIMED BY THE FOOLS!'",
            "🗣️ 'FEED THE CORPSE TO THE HOUNDS!'",
            "🗣️ 'WELL, THAT WAS A SHORT PERFORMANCE!'",
            "🗣️ 'ANOTHER DISAPPOINTING SACRIFICE!'",
            "🗣️ 'DOWN IN THE DUST WHERE YOU BELONG!'",
            "🗣️ 'REST IN PIECES, FOOL!'",
            "🗣️ 'BOOO! WHAT A TERRIBLE FIGHTER!'",
            "🗣️ 'THE ARENA CLAIMS ANOTHER VICTIM!'"
        ];

        const groundLevel = 290;
        
        // 4-Tier Pyramid Platforms Setup
        const platforms = [
            { x: 140, y: 230, width: 520, height: 12 }, 
            { x: 260, y: 170, width: 280, height: 12 }, 
            { x: 360, y: 110, width: 80, height: 12 }   
        ];

        // Unique Distinct Audience Spectators Setup
        const audienceMembers = [];
        for (let x = 80; x <= 225; x += 22) {
            audienceMembers.push({ x: x, y: 68, type: Math.floor(Math.random() * 5), size: 10 + Math.random() * 4, phase: Math.random() * 10, color: ['#c8b090', '#9e8263', '#d4af37', '#8a6f52', '#a67c52'][Math.floor(Math.random()*5)] });
            audienceMembers.push({ x: x + 8, y: 86, type: Math.floor(Math.random() * 5), size: 9 + Math.random() * 3, phase: Math.random() * 10, color: ['#c8b090', '#9e8263', '#d4af37', '#8a6f52', '#a67c52'][Math.floor(Math.random()*5)] });
        }
        for (let x = 575; x <= 720; x += 22) {
            audienceMembers.push({ x: x, y: 68, type: Math.floor(Math.random() * 5), size: 10 + Math.random() * 4, phase: Math.random() * 10, color: ['#c8b090', '#9e8263', '#d4af37', '#8a6f52', '#a67c52'][Math.floor(Math.random()*5)] });
            audienceMembers.push({ x: x + 8, y: 86, type: Math.floor(Math.random() * 5), size: 9 + Math.random() * 3, phase: Math.random() * 10, color: ['#c8b090', '#9e8263', '#d4af37', '#8a6f52', '#a67c52'][Math.floor(Math.random()*5)] });
        }

        const player = {
            x: 100,
            y: groundLevel - 42,
            width: 28,
            height: 42,
            speed: 4.5,
            vy: 0,
            gravity: 0.55,
            jumpForce: -9.2,
            isGrounded: true,
            hp: 100,
            maxHp: 100,
            damageMultiplier: 1.0,
            stamina: 100,
            maxStamina: 100,
            isDodging: false,
            dodgeTimer: 0,
            isAttacking: false,
            attackTimer: 0,
            facing: 1,
            comboCount: 0,
            comboTimer: 0,
            rotation: 0
        };

        const boss = {
            x: 650,
            y: groundLevel - 65,
            width: 48,
            height: 65,
            hp: 300,
            maxHp: 300,
            attackCooldown: 0,
            state: 'IDLE', 
            telegraphTimer: 0,
            dodgeTimer: 0,
            vx: 0,
            speedMultiplier: 1.0,
            hasDealtDamage: false,
            vy: 0,
            gravity: 0.55,
            jumpForce: -9.2,
            isGrounded: true,
            phase2Triggered: false,
            hasSecondWeapon: false,
            comboCount: 0
        };

        let lasers = [];
        let keys = { left: false, right: false };

        window.addEventListener('keydown', e => {
            if (gameState !== 'PLAYING') {
                if (e.key === 'Enter') handleActionButton();
                return;
            }
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') triggerJump();
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') triggerDodge();
            if (e.key === 'j' || e.key === 'Enter') triggerAttack();
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        });

        // Touch event bindings for mobile layout
        const bindTouch = (id, startAction, endAction) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); if(gameState==='PLAYING') startAction(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); if(endAction) endAction(); });
            el.addEventListener('mousedown', (e) => { e.preventDefault(); if(gameState==='PLAYING') startAction(); });
            el.addEventListener('mouseup', (e) => { e.preventDefault(); if(endAction) endAction(); });
        };

        bindTouch('btn-left', () => keys.left = true, () => keys.left = false);
        bindTouch('btn-right', () => keys.right = true, () => keys.right = false);
        bindTouch('btn-jump', () => triggerJump());
        bindTouch('btn-dodge', () => triggerDodge());
        bindTouch('btn-attack', () => triggerAttack());

        document.getElementById('btn-dmg-up').addEventListener('click', () => applyUpgrade('damage'));
        document.getElementById('btn-hp-up').addEventListener('click', () => applyUpgrade('health'));
        document.getElementById('btn-stamina-up').addEventListener('click', () => applyUpgrade('stamina'));
        btnAction.addEventListener('click', handleActionButton);

        function handleActionButton() {
            if (gameState === 'START') {
                startGame();
            } else if (gameState === 'DEATH') {
                restartGameAfterDeath();
            }
        }

        function startGame() {
            overlayScreen.style.display = "none";
            gameState = 'PLAYING';
        }

        function triggerJump() {
            if (player.isGrounded && !player.isDodging && player.stamina >= 15) {
                player.vy = player.jumpForce;
                player.isGrounded = false;
                player.stamina -= 15;
            }
        }

        function triggerDodge() {
            if (player.stamina >= 35 && !player.isDodging) {
                player.isDodging = true;
                player.dodgeTimer = 18; 
                player.stamina -= 35;
            }
        }

        function checkBossPhase2() {
            if (boss.hp <= boss.maxHp * 0.5 && !boss.phase2Triggered) {
                boss.phase2Triggered = true;
                boss.hasSecondWeapon = true;
                boss.speedMultiplier *= 1.25; 
                gameState = 'PHASE2_CUTSCENE';
                cutsceneTimer = 120; 
            }
        }

        function triggerAttack() {
            if (player.stamina >= 20 && !player.isAttacking && !player.isDodging) {
                player.facing = boss.x >= player.x ? 1 : -1;

                player.isAttacking = true;
                player.attackTimer = 12;
                player.stamina -= 20; 

                player.comboCount++;
                player.comboTimer = 180; 
                comboDisplay.innerText = player.comboCount;

                let hitBoxWidth = 75;
                let hitBoxX = player.facing > 0 ? player.x + player.width : player.x - hitBoxWidth;
                
                if (hitBoxX < boss.x + boss.width && hitBoxX + hitBoxWidth > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    
                    hitStopFrames = 3; 
                    spawnParticles(boss.x + boss.width / 2, boss.y + boss.height / 2, 'blood', 12);
                    spawnParticles(hitBoxX + hitBoxWidth / 2, player.y + 20, 'spark', 8);

                    let laserDmg = (15 + stats.level * 3) * player.damageMultiplier;
                    let meleeDmg = laserDmg * 2;
                    boss.hp -= meleeDmg;
                    checkBossPhase2();
                    if (boss.hp <= 0 && gameState === 'PLAYING') {
                        activeCrowdText = winDialogues[Math.floor(Math.random() * winDialogues.length)];
                        crowdTimer = 160;
                        gameState = 'WIN_DELAY';
                        winDelayTimer = 120;
                    }
                }

                if (boss.state === 'IDLE' && Math.abs(boss.x - player.x) < 220) {
                    boss.state = 'DODGING';
                    let dodgeDir = boss.x >= player.x ? 1 : -1; 
                    boss.vx = dodgeDir * 3.2; 
                    boss.dodgeTimer = 30; 
                }

                if (player.comboCount >= 4) {
                    lasers.push({
                        x: player.facing > 0 ? player.x + player.width : player.x - 25,
                        y: player.y + 16,
                        vx: player.facing * 14,
                        width: 45,
                        height: 10
                    });
                    player.comboCount = 0;
                    comboDisplay.innerText = player.comboCount;
                }
            }
        }

        function handleWin() {
            stats.wins++;
            winDisplay.innerText = stats.wins;

            if (stats.wins >= 10) {
                gameState = 'VICTORY';
                overlayTitle.innerText = "YOU WIN - LEGEND";
                overlayTitle.style.color = "#d4af37";
                overlayDesc.style.display = "none";
                upgradeOptions.style.display = "none";
                deathTutorialText.style.display = "none";
                btnAction.style.display = "none";
                overlayCredit.style.display = "block";
                overlayScreen.style.display = "flex";
                return;
            }

            gameState = 'WIN_PAUSE';
            overlayTitle.innerText = `Level ${stats.wins} Beaten!`;
            overlayTitle.style.color = "#d4af37";
            overlayDesc.style.display = "block";
            overlayDesc.innerText = "Choose your enhancement:";
            upgradeOptions.style.display = "flex";
            deathTutorialText.style.display = "none";
            btnAction.style.display = "none";
            overlayCredit.style.display = "none";
            overlayScreen.style.display = "flex";
        }

        function applyUpgrade(type) {
            if (type === 'damage') {
                player.damageMultiplier += 0.5;
            } else if (type === 'health') {
                player.maxHp += 50;
                player.hp = player.maxHp; 
            } else if (type === 'stamina') {
                player.maxStamina += 15;
                player.stamina = player.maxStamina;
            }
            resumeGame();
        }

        function resumeGame() {
            overlayScreen.style.display = "none";
            stats.level++;
            boss.speedMultiplier = 1.0 + (stats.wins * 0.25);
            boss.maxHp = 300 * Math.pow(2, stats.wins);
            boss.hp = boss.maxHp;
            boss.x = 650;
            boss.y = groundLevel - boss.height;
            boss.vy = 0;
            boss.state = 'IDLE';
            boss.hasDealtDamage = false;
            boss.phase2Triggered = false;
            boss.hasSecondWeapon = false;
            boss.comboCount = 0;
            
            player.hp = player.maxHp;
            player.x = 100;
            player.y = groundLevel - player.height;
            player.vy = 0;
            player.rotation = 0;
            playerTrail = [];
            particles = [];
            lvlDisplay.innerText = stats.level;
            gameState = 'PLAYING';
        }

        function triggerDeathSequence() {
            stats.deaths++;
            deathDisplay.innerText = stats.deaths;

            gameState = 'DEATH_ANIMATION';
            deathAnimTimer = 240; 
            player.vy = -7; 
            player.rotation = 0;
            boss.state = 'CELEBRATING'; 
            boss.vx = 0;
            activeCrowdText = loseDialogues[Math.floor(Math.random() * loseDialogues.length)];
            crowdTimer = 140;
        }

        function finalizeDeathScreen() {
            gameState = 'DEATH';
            overlayTitle.innerText = "YOU DIE";
            overlayTitle.style.color = "#e06c75";
            overlayDesc.style.display = "none";
            upgradeOptions.style.display = "none";

            const tutorialQuotes = [
                "💡 **Pro Tip:** When the boss drops to 50% HP, Phase 2 awakens with dual weapons and +25% speed!",
                "💡 **Pro Tip:** Time your dodge roll to phase through boss charges safely.",
                "💡 **Pro Tip:** Land 4 consecutive hits to fire a powerful ranged laser beam!",
                "💡 **Pro Tip:** Watch your stamina bar! Empty stamina disables movement speed.",
                "💡 **Pro Tip:** Use pyramid platforms to jump over aggressive charges."
            ];

            deathTutorialText.innerHTML = tutorialQuotes[Math.floor(Math.random() * tutorialQuotes.length)];
            deathTutorialText.style.display = "block";

            btnAction.innerText = "TRY AGAIN?";
            btnAction.style.display = "block";
            overlayCredit.style.display = "none";
            overlayScreen.style.display = "flex";
        }

        function restartGameAfterDeath() {
            overlayScreen.style.display = "none";
            stats.level = 1;
            stats.wins = 0;
            winDisplay.innerText = stats.wins;
            lvlDisplay.innerText = stats.level;
            
            player.maxHp = 100;
            player.hp = player.maxHp;
            player.damageMultiplier = 1.0;
            player.maxStamina = 100;
            player.stamina = player.maxStamina;
            player.x = 100;
            player.y = groundLevel - player.height;
            player.vy = 0;
            player.rotation = 0;
            playerTrail = [];
            particles = [];

            boss.speedMultiplier = 1.0;
            boss.maxHp = 300;
            boss.hp = boss.maxHp;
            boss.x = 650;
            boss.y = groundLevel - boss.height;
            boss.vy = 0;
            boss.state = 'IDLE';
            boss.hasDealtDamage = false;
            boss.phase2Triggered = false;
            boss.hasSecondWeapon = false;
            boss.comboCount = 0;

            player.comboCount = 0;
            comboDisplay.innerText = player.comboCount;
            gameState = 'PLAYING';
        }

        function applyPhysics(entity) {
            entity.vy += entity.gravity;
            entity.y += entity.vy;
            entity.isGrounded = false;

            let prevY = entity.y - entity.vy;
            let feetPrev = prevY + entity.height;
            let feetCurr = entity.y + entity.height;

            if (entity.y >= groundLevel - entity.height) {
                entity.y = groundLevel - entity.height;
                entity.vy = 0;
                entity.isGrounded = true;
                return;
            }

            platforms.forEach(plat => {
                if (entity.vy >= 0 && 
                    feetPrev <= plat.y && 
                    feetCurr >= plat.y && 
                    entity.x + entity.width > plat.x && 
                    entity.x < plat.x + plat.width) {
                    entity.y = plat.y - entity.height;
                    entity.vy = 0;
                    entity.isGrounded = true;
                }
            });
        }

        function update() {
            if (hitStopFrames > 0) {
                hitStopFrames--;
                return;
            }

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.type === 'dust') {
                    p.vy += 0.04;
                } else {
                    p.vy += 0.2; 
                }
                p.life++;
                p.alpha = 1 - (p.life / p.maxLife);
                if (p.life >= p.maxLife || p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            if (gameState === 'DEATH_ANIMATION') {
                deathAnimTimer--;
                player.vy += player.gravity;
                player.y += player.vy;
                player.rotation += 0.08; 

                if (player.y >= groundLevel - player.width) {
                    player.y = groundLevel - player.width;
                    player.vy = 0;
                    player.rotation = Math.PI / 2; 
                }

                applyPhysics(boss);
                if (boss.isGrounded && (deathAnimTimer % 35 === 0)) {
                    boss.vy = -6.5; 
                }

                if (deathAnimTimer <= 0) {
                    finalizeDeathScreen();
                }
                return;
            }

            if (gameState === 'PHASE2_CUTSCENE') {
                cutsceneTimer--;
                if (cutsceneTimer <= 0) {
                    gameState = 'PLAYING';
                }
                return;
            }

            if (gameState === 'WIN_DELAY') {
                winDelayTimer--;
                if (winDelayTimer <= 0) {
                    handleWin();
                }
                return;
            }

            if (gameState !== 'PLAYING') return;

            if (crowdTimer > 0) crowdTimer--;

            let isMoving = (keys.left || keys.right) && !player.isDodging;
            if (!isMoving && player.stamina < player.maxStamina) {
                player.stamina += 0.5; 
                if (player.stamina > player.maxStamina) player.stamina = player.maxStamina;
            }

            if (player.comboTimer > 0) {
                player.comboTimer--;
                if (player.comboTimer === 0) {
                    player.comboCount = 0;
                    comboDisplay.innerText = player.comboCount;
                }
            }

            if (player.isDodging) {
                playerTrail.push({ x: player.x, y: player.y, facing: player.facing });
                if (playerTrail.length > 5) playerTrail.shift();
            } else if (playerTrail.length > 0) {
                playerTrail.shift();
            }

            lasers.forEach((laser, index) => {
                laser.x += laser.vx;
                if (laser.x < boss.x + boss.width && laser.x + laser.width > boss.x &&
                    laser.y < boss.y + boss.height && laser.y + laser.height > boss.y) {
                    
                    hitStopFrames = 2;
                    spawnParticles(boss.x + boss.width / 2, boss.y + boss.height / 2, 'blood', 10);

                    let laserDmg = (15 + stats.level * 3) * player.damageMultiplier;
                    boss.hp -= laserDmg;
                    checkBossPhase2();
                    lasers.splice(index, 1);
                    if (boss.hp <= 0 && gameState === 'PLAYING') {
                        activeCrowdText = winDialogues[Math.floor(Math.random() * winDialogues.length)];
                        crowdTimer = 160;
                        gameState = 'WIN_DELAY';
                        winDelayTimer = 120;
                    }
                }
                if (laser.x < 0 || laser.x > canvas.width) lasers.splice(index, 1);
            });

            applyPhysics(player);
            if (!playerWasGrounded && player.isGrounded) {
                spawnParticles(player.x + player.width / 2, player.y + player.height, 'dust', 5);
            }
            playerWasGrounded = player.isGrounded;

            if (player.isDodging) {
                player.x += player.facing * 8.5;
                player.dodgeTimer--;
                if (player.dodgeTimer <= 0) player.isDodging = false;
            } else {
                let currentSpeed = player.stamina <= 0 ? player.speed * 0.25 : player.speed;
                if (keys.left) { player.x -= currentSpeed; player.facing = -1; }
                if (keys.right) { player.x += currentSpeed; player.facing = 1; }
            }

            if (player.x < 15) player.x = 15;
            if (player.x > canvas.width - 40) player.x = canvas.width - 40;

            if (player.isAttacking) {
                player.attackTimer--;
                if (player.attackTimer <= 0) player.isAttacking = false;
            }

            applyPhysics(boss);
            if (!bossWasGrounded && boss.isGrounded) {
                spawnParticles(boss.x + boss.width / 2, boss.y + boss.height, 'dust', 7);
            }
            bossWasGrounded = boss.isGrounded;

            let distanceToPlayer = Math.abs(boss.x - player.x);
            let verticalDistance = Math.abs(boss.y - player.y);

            if (boss.state === 'IDLE') {
                boss.attackCooldown++;
                let moveSpeed = (1.4 + (stats.level * 0.08)) * boss.speedMultiplier;
                let horizontalDiff = player.x - boss.x;

                let currentPlat = platforms.find(plat => 
                    Math.abs((boss.y + boss.height) - plat.y) < 6 && 
                    boss.x + boss.width > plat.x && 
                    boss.x < plat.x + plat.width
                );

                if (currentPlat && player.y > boss.y + boss.height + 15) {
                    let platCenter = currentPlat.x + currentPlat.width / 2;
                    let dir = player.x < platCenter ? -1 : 1;
                    boss.x += dir * moveSpeed;
                } else if (Math.abs(horizontalDiff) > 5) {
                    boss.x += Math.sign(horizontalDiff) * moveSpeed;
                }

                if (player.y < boss.y - 20 && boss.isGrounded && Math.abs(horizontalDiff) < 250 && Math.random() < 0.1) {
                    boss.vy = boss.jumpForce;
                    boss.isGrounded = false;
                }

                let speedDivisor = boss.hasSecondWeapon ? 1.25 : 1;
                if (distanceToPlayer < 120 && verticalDistance < 65 && boss.attackCooldown > Math.max(30, (80 - stats.wins * 5) / speedDivisor)) {
                    boss.state = 'CHARGING';
                    boss.telegraphTimer = Math.max(15, (35 - stats.wins * 2) / speedDivisor);
                    boss.attackCooldown = 0;
                    boss.hasDealtDamage = false; 
                }
            } 
            else if (boss.state === 'CHARGING') {
                boss.telegraphTimer--;
                if (boss.telegraphTimer <= 0) {
                    boss.state = 'ATTACKING';
                    boss.vx = (player.x > boss.x ? 1 : -1) * (11 * boss.speedMultiplier);
                }
            } 
            else if (boss.state === 'DODGING') {
                boss.x += boss.vx;
                boss.dodgeTimer--;
                boss.vx *= 0.88; 
                if (boss.dodgeTimer <= 0 || Math.abs(boss.vx) < 0.2) {
                    boss.vx = 0;
                    boss.state = 'IDLE';
                }
            }
            else if (boss.state === 'ATTACKING') {
                boss.x += boss.vx;
                if (player.x < boss.x + boss.width && player.x + player.width > boss.x &&
                    player.y < boss.y + boss.height && player.y + player.height > boss.y) {
                    let isJumpingOver = player.y + player.height < boss.y + 25; 
                    if (!player.isDodging && !isJumpingOver && !boss.hasDealtDamage) {
                        
                        hitStopFrames = 3;
                        spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 'blood', 14);
                        spawnParticles(player.x + player.width / 2, player.y + player.height / 2, 'spark', 6);

                        let baseDmg = 100 / 5;
                        let damageToPlayer = baseDmg * Math.pow(2, stats.wins);
                        
                        player.hp -= damageToPlayer;
                        boss.hasDealtDamage = true; 

                        shakeTimer = 16;
                        activeCrowdText = mockDialogues[Math.floor(Math.random() * mockDialogues.length)];
                        crowdTimer = 140;

                        if (player.hp <= 0) triggerDeathSequence();
                    }
                }
                if (Math.abs(boss.vx) > 0) {
                    boss.vx *= 0.82;
                    if (Math.abs(boss.vx) < 0.5) {
                        boss.vx = 0;
                        if (boss.hasSecondWeapon && boss.comboCount < 1) {
                            boss.comboCount++;
                            boss.state = 'CHARGING';
                            boss.telegraphTimer = 12; 
                            boss.hasDealtDamage = false;
                        } else {
                            boss.comboCount = 0;
                            boss.state = 'IDLE';
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            if (shakeTimer > 0) {
                shakeTimer--;
                ctx.translate((Math.random() - 0.5) * shakeIntensity, (Math.random() - 0.5) * shakeIntensity);
            }

            let bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#2b1e14');
            bgGradient.addColorStop(0.5, '#1d140e');
            bgGradient.addColorStop(1, '#120d09');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(212, 175, 55, 0.04)';
            ctx.beginPath();
            ctx.moveTo(100, 0); ctx.lineTo(200, 0); ctx.lineTo(350, canvas.height); ctx.lineTo(200, canvas.height);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(450, 0); ctx.lineTo(550, 0); ctx.lineTo(700, canvas.height); ctx.lineTo(550, canvas.height);
            ctx.fill();

            ctx.fillStyle = '#17100b';
            ctx.fillRect(0, 0, 75, canvas.height);
            ctx.fillRect(canvas.width - 75, 0, 75, canvas.height);

            ctx.fillStyle = '#1f150f';
            ctx.fillRect(75, 50, canvas.width - 150, 60);
            ctx.strokeStyle = '#3d2b1f';
            ctx.lineWidth = 2;
            ctx.strokeRect(75, 50, canvas.width - 150, 60);

            ctx.fillStyle = '#3d2b1f';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, 72, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Dynamic Audience Movement (Calm vs Excited)
            let isExcited = (crowdTimer > 0) || (gameState === 'WIN_DELAY' || gameState === 'WIN_PAUSE' || gameState === 'VICTORY' || gameState === 'DEATH' || gameState === 'DEATH_ANIMATION');
            let bounceSpeed = isExcited ? 70 : 350; 
            let bounceAmplitude = isExcited ? 7 : 1.2; 

            audienceMembers.forEach((bug) => {
                let bounce = Math.sin(Date.now() / bounceSpeed + bug.phase) * bounceAmplitude;
                let bx = bug.x;
                let by = bug.y + bounce;
                let s = bug.size;

                ctx.fillStyle = bug.color;
                ctx.beginPath();
                ctx.arc(bx, by, s, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#3d2b1f';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = isExcited ? '#e06c75' : '#120d09';
                ctx.fillRect(bx - s * 0.4, by - s * 0.2, s * 0.3, s * 0.3);
                ctx.fillRect(bx + s * 0.1, by - s * 0.2, s * 0.3, s * 0.3);
            });

            if (crowdTimer > 0) {
                ctx.fillStyle = 'rgba(18, 13, 9, 0.9)';
                ctx.fillRect(canvas.width / 2 - 210, 36, 420, 30);
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 2;
                ctx.strokeRect(canvas.width / 2 - 210, 36, 420, 30);

                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(activeCrowdText, canvas.width / 2, 55);
                ctx.textAlign = 'left';
            }

            platforms.forEach(plat => {
                ctx.fillStyle = '#2b1e14';
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
                ctx.strokeStyle = '#543d2b';
                ctx.lineWidth = 2;
                ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);
                ctx.strokeStyle = '#d4af37';
                ctx.beginPath();
                ctx.moveTo(plat.x, plat.y);
                ctx.lineTo(plat.x + plat.width, plat.y);
                ctx.stroke();
            });

            ctx.strokeStyle = '#694f38';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundLevel);
            ctx.lineTo(canvas.width, groundLevel);
            ctx.stroke();

            particles.forEach(p => {
                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
                ctx.restore();
            });

            lasers.forEach(laser => {
                ctx.fillStyle = 'rgba(212, 175, 55, 0.4)';
                ctx.fillRect(laser.x - 4, laser.y - 4, laser.width + 8, laser.height + 8);
                ctx.fillStyle = '#d4af37';
                ctx.fillRect(laser.x, laser.y, laser.width, laser.height);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(laser.x, laser.y + 3, laser.width, 4);
            });

            playerTrail.forEach((trail, index) => {
                ctx.save();
                ctx.globalAlpha = (index + 1) / (playerTrail.length + 1) * 0.35;
                ctx.fillStyle = '#d4af37';
                ctx.fillRect(trail.x + 4, trail.y + 14, 20, 22);
                ctx.fillRect(trail.x + 4, trail.y + 2, 20, 14);
                ctx.restore();
            });

            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            ctx.rotate(player.rotation);
            ctx.translate(-(player.x + player.width / 2), -(player.y + player.height / 2));

            let pDrawX = player.x;
            let pDrawY = player.y;

            ctx.fillStyle = gameState === 'DEATH_ANIMATION' ? '#e06c75' : (player.stamina <= 0 ? '#d19a66' : (player.isAttacking ? '#d19a66' : '#e0d0c0'));
            ctx.fillRect(pDrawX + 4, pDrawY + 14, 20, 22);
            ctx.fillRect(pDrawX + 4, pDrawY + 2, 20, 14);
            ctx.fillRect(pDrawX + 2, pDrawY - 6, 6, 10);
            ctx.fillRect(pDrawX + 20, pDrawY - 6, 6, 10);

            ctx.fillStyle = '#120d09';
            ctx.fillRect(player.facing > 0 ? pDrawX + 13 : pDrawX + 7, pDrawY + 6, 6, 4);

            if (player.isAttacking) {
                ctx.fillStyle = '#ffffff';
                let swordX = player.facing > 0 ? pDrawX + 24 : pDrawX - 45;
                ctx.fillRect(swordX, pDrawY + 16, 45, 6);
            }
            ctx.restore();

            ctx.save();
            ctx.translate(boss.x, boss.y);
            ctx.fillStyle = gameState === 'DEATH_ANIMATION' ? '#d4af37' : (boss.state === 'CHARGING' ? '#e06c75' : (boss.state === 'ATTACKING' ? '#be5046' : (boss.hasSecondWeapon ? '#6b3a3a' : '#544033')));
            ctx.fillRect(6, 12, 36, 53);

            ctx.fillStyle = '#b89768';
            ctx.beginPath();
            ctx.moveTo(6, 12); ctx.lineTo(0, 0); ctx.lineTo(12, 12);
            ctx.moveTo(42, 12); ctx.lineTo(48, 0); ctx.lineTo(36, 12);
            ctx.fill();

            ctx.fillStyle = boss.state === 'CHARGING' ? '#ffffff' : '#e06c75';
            ctx.fillRect(14, 20, 8, 4);
            ctx.fillRect(26, 20, 8, 4);

            // Both Boss Weapons Styled Red (#be5046 and #e06c75)
            ctx.fillStyle = '#be5046';
            ctx.fillRect(boss.x > player.x ? -14 : 42, 25, 14, 35);
            if (boss.hasSecondWeapon) {
                ctx.fillStyle = '#e06c75';
                ctx.fillRect(boss.x > player.x ? 46 : -22, 20, 12, 40);
            }
            ctx.restore();

            if (gameState === 'PHASE2_CUTSCENE') {
                ctx.fillStyle = 'rgba(18, 13, 9, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#d4af37';
                ctx.font = 'bold 18px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("⚠️ PHASE 2: DUAL WEAPONS! ⚠️", canvas.width / 2, canvas.height / 2 - 10);
                ctx.fillStyle = '#b89768';
                ctx.font = '12px sans-serif';
                ctx.fillText("Boss speed & fury increased!", canvas.width / 2, canvas.height / 2 + 15);
                ctx.textAlign = 'left';
            }

            // UI Bars
            ctx.fillStyle = '#21160f';
            ctx.fillRect(15, 15, 130, 10);
            ctx.fillStyle = '#98c379';
            ctx.fillRect(15, 15, Math.max(0, (player.hp / player.maxHp) * 130), 10);
            ctx.fillStyle = '#fff';
            ctx.font = '9px sans-serif';
            ctx.fillText(`HP: ${Math.max(0, Math.floor(player.hp))}`, 20, 23);

            ctx.fillStyle = '#21160f';
            ctx.fillRect(15, 28, 90, 6);
            ctx.fillStyle = player.stamina <= 0 ? '#e06c75' : '#d4af37';
            ctx.fillRect(15, 28, Math.min(90, (player.stamina / player.maxStamina) * 90), 6);

            ctx.fillStyle = '#21160f';
            ctx.fillRect(canvas.width - 145, 15, 130, 10);
            ctx.fillStyle = boss.hasSecondWeapon ? '#e06c75' : '#be5046';
            ctx.fillRect(canvas.width - 145, 15, Math.max(0, (boss.hp / boss.maxHp) * 130), 10);
            ctx.fillStyle = '#fff';
            ctx.fillText(`BOSS ${boss.hasSecondWeapon ? 'P2' : ''}`, canvas.width - 120, 23);

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
